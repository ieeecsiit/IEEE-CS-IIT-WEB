<!DOCTYPE html>
<html data-wf-page="667187163156a5df09557ed5">

    <head>

        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />

        <title>IEEECS Official Website</title>

        <link href="css/normalize.css" rel="stylesheet" type="text/css" />
        <link href="css/layout.css" rel="stylesheet" type="text/css" />
        <link href="css/style.css" rel="stylesheet" type="text/css" />


        <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon" />
        <link href="images/webclip.png" rel="apple-touch-icon" />

    </head>

    <body>

        <div id="navbar-placeholder"></div>

        <div class="sitemap">
            <div class="w-layout-blockcontainer main-container w-container">
                <div class="inner-sitemap">
                    <h2 data-w-id="darkyn25" style="opacity: 0;" class="sitemap-heading">contact</h2>
                    <div data-w-id="darkyn26" style="opacity: 0;" class="stemap-text">Who We are and what we do</div>
                </div>
            </div>
        </div>

        <div class="contact-section">
            <div class="w-layout-blockcontainer main-container w-container">
                <div id="darkyn36" class="w-layout-layout contact-stack wf-layout-layout">
                    <div class="w-layout-cell single-cell">
                        <p class="contact-text">We&#x27;re dedicated to empowering individuals alike. Let&#x27;s explore opportunities together.</p>
                        <p class="contact-location">IEEE Computer Society SBC of IIT</p>
                        <p class="contact-location">No 10,</p>
                        <p class="contact-location">Trelawney Place,</p>
                        <p class="contact-location">Colombo 04</p></br>
                        <a href="tel:+94-543-2101" class="contact-link">+94 70 446 0101  - Kithsara Medawewa</a>
                        <a href="tel:+94-543-2101" class="contact-link">+94 75 527 8882  -  Vinuka Jayavihan</a>
                        
                    </div>

                    <div class="w-layout-cell single-cell">
                        <h2 class="comtact-main-title contact-title-with-border">drop us a line</h2>
                        <div class="contact-form-block w-form">
                            <form id="email-form2" data-wf-ignore="true" novalidate action="https://script.google.com/macros/s/AKfycbwxzKQ9HXHjK_tBAmZHBSxtIqtdGLYGAdInBshEC5z5krK4jqpeSn-w5sJJ2X6fCE7tfw/exec">
                                <div id="darkyn30" class="w-layout-layout form-stack wf-layout-layout">
                                    <div id="darkyn31" class="w-layout-cell form-cell">
                                        <input class="input-style w-input" maxlength="256" name="name" data-name="Name" placeholder="Name *" type="text" id="name" required="" />
                                    </div>
                                    <div id="darkyn32" class="w-layout-cell form-cell">
                                        <input class="input-style w-input" maxlength="256" name="Last-Name" data-name="Last Name" placeholder="Last Name *" type="text" id="last-name" required="" />
                                    </div>
                                    <div id="darkyn33" class="w-layout-cell form-cell">
                                        <input class="input-style w-input" maxlength="256" name="email" data-name="Email" placeholder="Email Address *" type="email" id="email" required="" />
                                    </div>
                                    <div id="darkyn34" class="w-layout-cell form-cell">
                                        <input class="input-style w-input" maxlength="256" name="Phone-Number" data-name="Phone Number" placeholder="Phone Number" type="tel" id="phone-number" />
                                    </div>
                                    <div id="darkyn35" class="w-layout-cell form-cell">
                                        <input class="input-style textarea w-input" maxlength="256" name="Message" data-name="Message" placeholder="Message *" type="text" id="message" required="" />
                                    </div>
                                </div>
                                <input type="submit" class="submit-button w-button" value="send" />
                            </form>
                        </div>
                        
                        <script>
                        document.getElementById('email-form2').addEventListener('submit', function (e) {
                            e.preventDefault();

                            const formData = new FormData();

                            formData.append("entry.1111111111", document.getElementById("name").value);
                            formData.append("entry.2222222222", document.getElementById("last-name").value);
                            formData.append("entry.3333333333", document.getElementById("email").value);
                            formData.append("entry.4444444444", document.getElementById("phone-number").value);
                            formData.append("entry.5555555555", document.getElementById("message").value);

                            fetch(
                                "https://docs.google.com/forms/d/e/1FAIpQLSca4K50sO2CYZTQMBXNUfQnhrwmttF_MDgH_XxDOueZYvAlpg/formResponse",
                                {
                                    method: "POST",
                                    mode: "no-cors",
                                    body: formData
                                }
                            ).then(() => {
                                alert("Thank you! Your message has been sent.");
                                document.getElementById('email-form2').reset();
                            });
                        });
                        </script>

                    </div>
                </div>
            </div>
        </div>

        <div id="footer-placeholder"></div>

        <script src="js/jquery.min.js" type="text/javascript"></script>
        <script src="js/plugins.js" type="text/javascript"></script>
        <script src="js/navbar.js"></script>
        <script src="js/footer.js"></script>

    </body>

</html>
